services:
  credentials:
    image: ghcr.io/handys11/rustplusapi-credentials:latest
    restart: unless-stopped
    # Loopback only, and not just for hardening: the Steam login completes solely when the browser
    # reaches this app over loopback, so exposing it on a routable address would not make it usable
    # from another machine anyway. See README.md, "Why this is loopback-only".
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # The loopback origin you actually open, matching the published port above. This is the value
      # Facepunch redirects back to; a non-loopback value is accepted at startup but the Steam login
      # will fail with "Failed to send login message to the Rust+ app".
      CredentialsWeb__PublicBaseUrl: "http://localhost:8080"
      # Startup otherwise requires https, which is left over from the abandoned hosted design.
      # On loopback, plain http is the normal case.
      CredentialsWeb__AllowInsecureBaseUrl: "true"
    # Enforces "nothing is written to disk" at the runtime level rather than by intent.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
