name: SonarQube Analysis

permissions:
    contents: read

# Analyze only the long-lived branch. This SonarQube instance is Community Edition,
# which has no branch/PR support — every analysis writes to the single main branch.
# Running on `pull_request` lets Scanner for .NET v8 auto-enable "incremental PR
# analysis" (changed-files-only) and overwrite the main project with a partial scope,
# which is what collapsed Lines of Code to ~23. PR build/test feedback is covered by CI.yml.
on:
  push:
    branches:
      - develop

jobs:
  build:
    name: Build and analyze
    # Ubuntu: dotnet-sonarscanner is cross-platform, and Linux runners are faster and cheaper
    # than Windows for this job.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The scanner engine needs Java 21 (SonarQube dropped Java 17 for analysis in 2026). This JDK is
      # what runs it: `begin` passes sonar.scanner.skipJreProvisioning=true, so the scanner does not
      # download its own JRE from the SonarQube server. That download timed out once, and the engine
      # then fell back to the Java 17 installed here and crashed on startup (`Pipe is broken`, exit 134).
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # ~/.sonar/cache holds the scanner engine and the analyzer plugins, both served by the SonarQube
      # server for its own version, so the cache is keyed on that version. A fixed key is saved once and
      # never overwritten, which left every run after a server upgrade downloading the new plugins and
      # then discarding them. No restore-keys: after an upgrade the cache starts empty rather than
      # carrying the previous version's jars forward. The version is hashed so the job log does not
      # reveal the version of a server whose address is kept in a secret.
      - name: Resolve SonarQube server version
        id: sonar-server
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          version="$(curl -fsS --retry 3 "${SONAR_HOST_URL%/}/api/server/version")"
          echo "cache-key=$(printf '%s' "$version" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache SonarQube packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ steps.sonar-server.outputs.cache-key }}

      # dotnet-sonarscanner is pinned in .config/dotnet-tools.json, where Dependabot bumps it with the
      # other NuGet packages. It used to be installed into a tool-path cache with a fixed key, and the
      # install step only ran on a cache miss, so the scanner never moved past the first version cached.
      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build and analyze
        # Coverage is handed to SonarQube as ONE pre-merged report rather than the raw per-project,
        # per-TFM opencover files. Passing the raw set understates coverage: the libraries are
        # multi-targeted, so a file with a `#if NET10_0_OR_GREATER` fork is fully covered only across
        # both reports, and SonarQube does not union them — it settles on one, and every line the
        # other TFM covered reads as uncovered. ReportGenerator merges them properly first (the same
        # merge tools/coverage/report.sh gates on), then emits SonarQube's generic coverage format.
        # The junit logger writes one file per test assembly and TFM for the Codecov test-results upload.
        run: |
          dotnet tool run dotnet-sonarscanner begin /k:"${{ secrets.SONAR_PROJECT_KEY }}" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" /d:sonar.scanner.skipJreProvisioning=true /d:sonar.exclusions="**/samples/**" /d:sonar.coverage.exclusions="**/samples/**,**/tests/**,**/tools/**,**/wwwroot/**,**/apps/**/Program.cs" /d:sonar.coverageReportPaths="TestResults/sonarqube/SonarQube.xml"
          dotnet build
          dotnet test --no-build --settings tools/coverage/sonar.runsettings --results-directory ./TestResults --blame-hang-timeout 60s --logger "junit;LogFileName={assembly}.{framework}.junit.xml"
          dotnet tool run reportgenerator -- "-reports:TestResults/**/coverage.opencover.xml" "-targetdir:TestResults/sonarqube" "-reporttypes:SonarQube"
          dotnet tool run dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # Codecov Test Analytics reads only JUnit XML, which `dotnet test` did not produce, so this step
      # used to find nothing to send and still pass. It now names the junit logger's files, skips the
      # filename search, and fails the job if nothing is uploaded.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ./TestResults/*.junit.xml
          disable_search: true
          fail_ci_if_error: true
