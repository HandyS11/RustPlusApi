name: Continuous Integration

permissions:
    contents: read

on:
  push:
    branches-ignore:
      - "main"
  pull_request:
    branches-ignore:
      - "main"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        # net8.0 host resolves the netstandard2.0 build of the libraries; net10.0 host
        # resolves the net10.0 build. The test project multi-targets both so the same
        # suite validates both compiled outputs (parity).
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test (net8.0 = netstandard2.0 build, and net10.0) with coverage
      run: >
        dotnet test --no-build --verbosity normal
        --settings tests/RustPlusApi.Tests/coverlet.runsettings
        --results-directory ${{ github.workspace }}/TestResults

    - name: Enforce coverage threshold
      # Achieved: ~99.3-99.6% line / ~97.3-97.6% branch. The gap to 100% is irreducible
      # (compiler-generated async state-machine branches + live-socket/network lines that
      # cannot be exercised offline). See docs/testing.md. Floor is set just below achieved.
      run: python3 tools/coverage/check_threshold.py 90 90
