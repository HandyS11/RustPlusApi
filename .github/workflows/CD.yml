name: CD

permissions:
    contents: write
    packages: write
    id-token: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Resolve Version from Tag
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        if [[ "$VERSION" == *-* ]]; then
          echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          echo "Resolved prerelease version $VERSION."
        else
          echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          echo "Resolved stable version $VERSION."
        fi

    - name: Verify Tag Branch
      run: |
        git fetch origin main develop
        if [[ "$IS_PRERELEASE" == "true" ]]; then
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
             || git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
            echo "Prerelease tag $GITHUB_REF_NAME verified on main or develop."
          else
            echo "::error::Prerelease tag $GITHUB_REF_NAME does not point to a commit on main or develop."
            exit 1
          fi
        elif ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "::error::Stable tag $GITHUB_REF_NAME does not point to a commit on main."
          exit 1
        else
          echo "Stable tag $GITHUB_REF_NAME verified on main."
        fi

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Pack NuGet Package RustPlusApi
      run: cd ./src/RustPlusApi/ && dotnet pack --configuration Release -p:Version=$VERSION

    - name: Pack NuGet Package RustPlusApi.Fcm
      run: cd ./src/RustPlusApi.Fcm/ && dotnet pack --configuration Release -p:Version=$VERSION

    - name: Pack NuGet Package RustPlusApi.Fcm.Registration
      run: cd ./src/RustPlusApi.Fcm.Registration/ && dotnet pack --configuration Release -p:Version=$VERSION

    - name: Pack NuGet Package RustPlusApi.Camera
      run: cd ./src/RustPlusApi.Camera/ && dotnet pack --configuration Release -p:Version=$VERSION

    - name: Pack NuGet Package RustPlusApi.Extensions.DependencyInjection
      run: cd ./src/RustPlusApi.Extensions.DependencyInjection/ && dotnet pack --configuration Release -p:Version=$VERSION

    - name: Pack NuGet Package RustPlusApi.Fcm.Extensions.DependencyInjection
      run: cd ./src/RustPlusApi.Fcm.Extensions.DependencyInjection/ && dotnet pack --configuration Release -p:Version=$VERSION

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        path: ./**/*.nupkg

    - name: NuGet login (trusted publishing)
      uses: NuGet/login@v1
      id: login
      with:
        user: HandyS11

    - name: Publish NuGet Package to NuGet.org
      run: dotnet nuget push ./**/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Publish NuGet Package to GitHub Packages
      run: dotnet nuget push ./**/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        shopt -s globstar
        PRERELEASE_FLAG=""
        if [[ "$IS_PRERELEASE" == "true" ]]; then
          PRERELEASE_FLAG="--prerelease"
        fi
        gh release create "$GITHUB_REF_NAME" ./**/*.nupkg ./**/*.snupkg --generate-notes $PRERELEASE_FLAG

  publish-image:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Resolve Version from Tag
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        if [[ "$VERSION" == *-* ]]; then
          echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
        else
          echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
        fi

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Compute image tags
      run: |
        # Docker repository names must be lowercase; github.repository_owner expands to the
        # capitalized "HandyS11" and buildx rejects that outright. Hardcoded rather than
        # lowercased dynamically, to match the image reference documented throughout the app
        # (README, Caddyfile.example, SessionEndpoints' self-host pointer).
        OWNER="handys11"
        TAGS="ghcr.io/$OWNER/rustplusapi-credentials:$VERSION"
        # 'latest' only follows stable releases, so a prerelease never becomes the default pull.
        if [[ "$IS_PRERELEASE" == "false" ]]; then
          TAGS="$TAGS,ghcr.io/$OWNER/rustplusapi-credentials:latest"
        fi
        echo "TAGS=$TAGS" >> "$GITHUB_ENV"

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: apps/RustPlusApi.CredentialsWeb/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ env.TAGS }}
