name: CD

permissions:
    contents: write
    packages: write
    id-token: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Resolve Version from Tag
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        # Validate before anything uses it. The prerelease/stable channel must be decided from the
        # version NuGet actually publishes: a raw "contains a dash" test let v2.0.0+r-1 (a dash only
        # inside SemVer build metadata, which NuGet drops from the identity) pass as a prerelease and
        # then publish a stable 2.0.0, and ';'/',' in the value split -p:Version into extra MSBuild
        # properties. So reject build metadata and both separators: only vMAJOR.MINOR.PATCH[-prerelease].
        SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
        if [[ ! "$VERSION" =~ $SEMVER ]]; then
          echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-prerelease]."
          exit 1
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        if [[ -n "${BASH_REMATCH[4]}" ]]; then
          echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          echo "Resolved prerelease version $VERSION."
        else
          echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          echo "Resolved stable version $VERSION."
        fi

    - name: Verify Tag Branch
      run: |
        git fetch origin main develop
        if [[ "$IS_PRERELEASE" == "true" ]]; then
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
             || git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
            echo "Prerelease tag $GITHUB_REF_NAME verified on main or develop."
          else
            echo "::error::Prerelease tag $GITHUB_REF_NAME does not point to a commit on main or develop."
            exit 1
          fi
        elif ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "::error::Stable tag $GITHUB_REF_NAME does not point to a commit on main."
          exit 1
        else
          echo "Stable tag $GITHUB_REF_NAME verified on main."
        fi

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Pack NuGet Package RustPlusApi
      run: cd ./src/RustPlusApi/ && dotnet pack --configuration Release -p:Version="$VERSION"

    - name: Pack NuGet Package RustPlusApi.Fcm
      run: cd ./src/RustPlusApi.Fcm/ && dotnet pack --configuration Release -p:Version="$VERSION"

    - name: Pack NuGet Package RustPlusApi.Fcm.Registration
      run: cd ./src/RustPlusApi.Fcm.Registration/ && dotnet pack --configuration Release -p:Version="$VERSION"

    - name: Pack NuGet Package RustPlusApi.Camera
      run: cd ./src/RustPlusApi.Camera/ && dotnet pack --configuration Release -p:Version="$VERSION"

    - name: Pack NuGet Package RustPlusApi.Extensions.DependencyInjection
      run: cd ./src/RustPlusApi.Extensions.DependencyInjection/ && dotnet pack --configuration Release -p:Version="$VERSION"

    - name: Pack NuGet Package RustPlusApi.Fcm.Extensions.DependencyInjection
      run: cd ./src/RustPlusApi.Fcm.Extensions.DependencyInjection/ && dotnet pack --configuration Release -p:Version="$VERSION"

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        path: ./**/*.nupkg

    - name: NuGet login (trusted publishing)
      uses: NuGet/login@v1
      id: login
      with:
        user: HandyS11

    - name: Publish NuGet Package to NuGet.org
      run: dotnet nuget push ./**/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Publish NuGet Package to GitHub Packages
      run: dotnet nuget push ./**/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        shopt -s globstar
        PRERELEASE_FLAG=""
        if [[ "$IS_PRERELEASE" == "true" ]]; then
          PRERELEASE_FLAG="--prerelease"
        fi
        gh release create "$GITHUB_REF_NAME" ./**/*.nupkg ./**/*.snupkg --generate-notes $PRERELEASE_FLAG
