# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Every NuGet bump lands in a single PR: versions are centrally managed in
      # Directory.Packages.props, so one-PR-per-package just serialises conflicts on one file.
      nuget:
        patterns:
          - "*"
    ignore:
      # ImageSharp 3.x+ requires net6+, which would drop the netstandard2.0 target.
      # Patches within the 2.1.x line are still picked up.
      - dependency-name: "SixLabors.ImageSharp"
        update-types:
          - "version-update:semver-major"
      # The .NET 11 wave of these packages ships no net8.0 asset (net462, netstandard2.0, net10.0
      # and net11.0 only), so a net8.0 or net9.0 process loads their netstandard2.0 build instead.
      # That build is not binary compatible with code compiled against the net8.0 one: it declares
      # its own IsExternalInit, so every call to an init-only setter fails to bind. With
      # System.Text.Json 11.0.0 the net8.0 test hosts, which exist to run the netstandard2.0 build of
      # the libraries (docs/development/testing.md), die on start-up with a MissingMethodException
      # for JsonObjectInfoValues.set_ObjectCreator, and an application on .NET 8 or 9 that consumes
      # these libraries would hit the same failure. Patches within the 10.0.x line are still picked
      # up. Lift this when the parity run no longer needs a host older than net10.0.
      - dependency-name: "Microsoft.Extensions.*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "Microsoft.Bcl.AsyncInterfaces"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "System.Text.Json"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "System.Threading.Channels"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
