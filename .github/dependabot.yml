# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Every NuGet bump lands in a single PR: versions are centrally managed in
      # Directory.Packages.props, so one-PR-per-package just serialises conflicts on one file.
      nuget:
        patterns:
          - "*"
    ignore:
      # ImageSharp 3.x+ requires net6+, which would drop the netstandard2.0 target.
      # Patches within the 2.1.x line are still picked up.
      - dependency-name: "SixLabors.ImageSharp"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    # The lint toolchain for apps/RustPlusApi.CredentialsWeb/wwwroot/app.js (ESLint + typescript-eslint
    # + eslint-plugin-sonarjs), the local mirror of SonarQube's JavaScript rules. Dev-only: nothing
    # from it ships in the app.
    directory: "/apps/RustPlusApi.CredentialsWeb"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns:
          - "*"
