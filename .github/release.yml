# Groups the release notes GitHub generates (CD.yml runs `gh release create --generate-notes`) by
# pull request label. The PR Labels workflow (workflows/PrLabels.yml) sets enhancement, bug and
# documentation from each pull request's Conventional Commits title, and Dependabot labels its own
# pull requests dependencies plus github_actions or .NET. A pull request lands in the first category
# whose labels it has; anything unlabelled (chore, refactor, test, build, ci, style) lands in Internal.
# https://docs.github.com/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
        - github_actions
    - title: Internal
      labels:
        - "*"
