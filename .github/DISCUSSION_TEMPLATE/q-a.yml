title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Have a usage question? You're in the right place. Please check the
        [documentation](https://handys11.github.io/RustPlusApi/) and
        [existing discussions](https://github.com/HandyS11/RustPlusApi/discussions) first.

        ⚠️ Found a bug? Open an [issue](https://github.com/HandyS11/RustPlusApi/issues/new/choose) instead.
        🔒 Security concern? Use a [Security Advisory](https://github.com/HandyS11/RustPlusApi/security/advisories/new).
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package is your question about?
      options:
        - RustPlusApi (core)
        - RustPlusApi.Camera
        - RustPlusApi.Fcm
        - RustPlusApi.Fcm.Registration
        - RustPlusApi.Extensions.DependencyInjection
        - RustPlusApi.Fcm.Extensions.DependencyInjection
        - General / not sure
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and what's getting in your way?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Code snippets, configuration, or approaches you've already attempted. Redact any tokens/credentials.
      render: csharp
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Package version
      description: The NuGet version you're running (optional).
      placeholder: "2.0.0"
    validations:
      required: false
